aid: comscore
name: Comscore
description: >-
  Comscore is a cross-platform media measurement and audience analytics company
  that provides a trusted, independent currency for planning, transacting, and
  evaluating media across digital, social, television, streaming/CTV, movies, and
  programmatic advertising. Its products measure audiences, brands, and consumer
  behavior for media buyers and sellers, spanning advertising effectiveness, CTV
  and video measurement, programmatic targeting (Proximic by Comscore), social
  intelligence, and box-office tracking. Comscore publishes first-party audience-
  measurement SDKs for Android, iOS/tvOS, and Flutter used to instrument content
  and apps, and maintains an ISO/IEC 27001-certified trust and security program.
  It does not currently expose a public self-serve REST API or developer portal.
